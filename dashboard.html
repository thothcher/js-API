<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <header class="topbar">
        <div class="topbar-inner">
            <h1>🚗 Cars Dashboard</h1>
            <p>CRUD demo — GET / POST / PUT / DELETE against a REST API</p>
        </div>
    </header>

    <main class="layout">

        <!-- CREATE / UPDATE form -->
        <section class="card form-card">
            <h2 id="form-title">Add a new car</h2>
            <form id="car-form">
                <input type="hidden" id="car-id">

                <label for="name">Name</label>
                <input type="text" id="name" placeholder="e.g. Ferrari 250 GTO" required>

                <label for="manufacturer">Manufacturer</label>
                <input type="text" id="manufacturer" placeholder="e.g. Ferrari" required>

                <label for="year">Year</label>
                <input type="number" id="year" placeholder="e.g. 1963" required>

                <label for="priceUSD">Price (USD)</label>
                <input type="number" id="priceUSD" placeholder="e.g. 70000000" required>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn btn-primary">Add car</button>
                    <button type="button" id="cancel-btn" class="btn btn-ghost" hidden>Cancel</button>
                </div>
            </form>
        </section>

        <!-- READ -->
        <section class="card list-card">
            <div class="list-header">
                <h2>Cars</h2>
                <button id="refresh-btn" class="btn btn-ghost">⟳ Refresh</button>
            </div>
            <div id="status" class="status" hidden></div>
            <div id="cars" class="cars-grid"></div>
        </section>

    </main>

    <script src="dashboard.js"></script>
</body>
</html>
